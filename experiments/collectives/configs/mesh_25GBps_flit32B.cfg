// Shared experiment configuration. Original BookSim fields only.
// 1 cycle = 1 ns. Link serialization (32 B / 25 GB/s = 1.28 ns)
// and 21 ns propagation are implemented by external RateChannel adapters.
topology = mesh;
k = 8;
n = 2;
c = 1;
subnets = 1;
classes = 1;
router = iq;
routing_function = dor;
num_vcs = 4;
vc_buf_size = 318;
buffer_policy = private;
// Conservative VCT: allocate an empty VC, with room for the entire packet,
// and retain it until all tail credits return. Audit every head admission.
wait_for_tail_credit = 1;
hold_switch_for_packet = 1;
vc_allocator = islip;
sw_allocator = islip;
alloc_iters = 1;
routing_delay = 0;
vc_alloc_delay = 1;
sw_alloc_delay = 1;
st_prepare_delay = 0;
st_final_delay = 1;
credit_delay = 2;
input_speedup = 1;
output_speedup = 1;
internal_speedup = 1.0;
use_read_write = 0;
priority = none;
traffic = uniform;
packet_size = 16;
injection_rate = 1.0;
sim_type = latency;
sim_count = 1;
seed = 0;
deadlock_warn_timeout = 1000000;
